services:

  postgres:
    image: postgres:16-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: frauduser
      POSTGRES_PASSWORD: fraudpass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauduser -d frauddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fraud-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: fraud-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.4
    container_name: fraud-loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.4
    container_name: fraud-promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./infra/monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - "C:/Users/DELL/AppData/Local/Temp:/var/log/services:ro"
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  transaction-service:
    image: fraud/transaction-service:latest
    container_name: fraud-transaction-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  rule-engine:
    image: fraud/rule-engine:latest
    container_name: fraud-rule-engine
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  ml-engine:
    image: fraud/ml-engine:latest
    container_name: fraud-ml-engine
    environment:
      ML_ENGINE_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8083:8083"
    depends_on:
      - kafka

  fraud-decision-engine:
    image: fraud/fraud-decision-engine:latest
    container_name: fraud-decision-engine
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  explainability-engine:
    image: fraud/explainability-engine:latest
    container_name: fraud-explainability-engine
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    image: fraud/notification-service:latest
    container_name: fraud-notification-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTION_SERVICE_URL: http://transaction-service:8081
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  audit-service:
    image: fraud/audit-service:latest
    container_name: fraud-audit-service
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway:
    image: fraud/api-gateway:latest
    container_name: fraud-api-gateway
    environment:
      TRANSACTION_SERVICE_URL: http://transaction-service:8081
      RULE_ENGINE_URL: http://rule-engine:8082
      ML_ENGINE_URL: http://ml-engine:8083
      FRAUD_DECISION_ENGINE_URL: http://fraud-decision-engine:8084
      EXPLAINABILITY_ENGINE_URL: http://explainability-engine:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/fraud-detection/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      - transaction-service
      - rule-engine
      - ml-engine
      - fraud-decision-engine
      - explainability-engine
      - notification-service

volumes:
  postgres-data:
  kafka-data:
  keycloak-data:
  prometheus-data:
  loki-data:
  grafana-data:
