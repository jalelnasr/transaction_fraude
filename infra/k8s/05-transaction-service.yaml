apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels: { app: transaction-service }
  template:
    metadata:
      labels: { app: transaction-service }
    spec:
      containers:
        - name: transaction-service
          image: fraud/transaction-service:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: fraud-config }
            - secretRef: { name: fraud-db-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: fraud-detection
spec:
  selector: { app: transaction-service }
  ports: [{ port: 8081, targetPort: 8081 }]
