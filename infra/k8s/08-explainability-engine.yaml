apiVersion: apps/v1
kind: Deployment
metadata:
  name: explainability-engine
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels: { app: explainability-engine }
  template:
    metadata:
      labels: { app: explainability-engine }
    spec:
      containers:
        - name: explainability-engine
          image: fraud/explainability-engine:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8085 }]
          envFrom:
            - configMapRef: { name: fraud-config }
            - secretRef: { name: fraud-db-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: explainability-engine
  namespace: fraud-detection
spec:
  selector: { app: explainability-engine }
  ports: [{ port: 8085, targetPort: 8085 }]
