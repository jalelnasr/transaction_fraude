apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-engine
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels: { app: ml-engine }
  template:
    metadata:
      labels: { app: ml-engine }
    spec:
      containers:
        - name: ml-engine
          image: fraud/ml-engine:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 8083 }]
          env:
            - { name: ML_ENGINE_KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092" }
---
apiVersion: v1
kind: Service
metadata:
  name: ml-engine
  namespace: fraud-detection
spec:
  selector: { app: ml-engine }
  ports: [{ port: 8083, targetPort: 8083 }]
