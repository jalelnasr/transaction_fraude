<div class="page">
  <app-page-header title="Regles metier" subtitle="Regles de detection configurees sur la plateforme"></app-page-header>

  @if (loading()) {
    <p>Chargement...</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Type</th>
          <th>Condition</th>
          <th>Poids</th>
          <th>Statut</th>
        </tr>
      </thead>
      <tbody>
        @for (rule of rules(); track rule.id) {
          <tr>
            <td>{{ rule.name }}</td>
            <td>{{ rule.type }}</td>
            <td>{{ describe(rule) }}</td>
            <td>{{ rule.weight }}</td>
            <td>
              <span class="badge" [class]="rule.active ? 'active' : 'inactive'">
                {{ rule.active ? 'Active' : 'Inactive' }}
              </span>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="5">Aucune regle configuree.</td></tr>
        }
      </tbody>
    </table>
  }
</div>
